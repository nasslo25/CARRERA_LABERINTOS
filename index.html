<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>AR Aventura - Tablero Interactivo Phygital</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
    #overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    
    #ui { position: fixed; z-index: 20; left: 12px; top: 12px; max-width: 320px; color: #fff; background: rgba(0,0,0,.8); padding: 14px; border-radius: 12px; backdrop-filter: blur(5px); }
    #ui h2 { margin: 0 0 10px; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 8px; }
    #status { font-size: 14px; font-weight: bold; color: #ffeb3b; margin-bottom: 10px; }
    button { border: 0; border-radius: 8px; padding: 10px; font-weight: bold; cursor: pointer; background: #00c853; color: #fff; width: 100%; margin-bottom: 6px; }
    button:hover { background: #00e676; }
    button#debug { background: #fff; color: #111; }
    button#debug:hover { background: #eee; }
    
    #objects { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    
    /* Casillas del Tablero */
    .cell { position: absolute; left: 0; top: 0; width: 55px; height: 55px; transform: translate(-50%,-50%); display: none; will-change: left, top, transform; transition: transform 0.2s; }
    .cell img { width: 100%; height: 100%; filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
    .cell.active { transform: translate(-50%,-50%) scale(1.4); z-index: 30; } 

    /* Panel de Trivia Central */
    #triviaPanel { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(0); width: 300px; background: rgba(25,25,35,0.95); border: 3px solid #ff9800; border-radius: 16px; padding: 20px; color: #fff; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 40; pointer-events: auto; }
    #triviaPanel.show { transform: translate(-50%,-50%) scale(1); }
    #triviaIcon { font-size: 45px; margin: 0; }
    #triviaTitle { color: #ffeb3b; margin: 5px 0 15px; font-size: 22px; }
    #triviaQuestion { font-size: 17px; line-height: 1.4; margin-bottom: 20px; }
    #closeTrivia { background: #ff9800; color: #000; font-size: 16px; }
    #closeTrivia:hover { background: #ffb74d; }

    #loading { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #111; color: #fff; text-align: center; }
    #loading.hide { display: none; }
    #process { display: none; }
  </style>
</head>
<body>
  <!-- Pantalla de carga -->
  <div id="loading">
    <div>
      <h2>🏕️ AR Aventura</h2>
      <p id="loadText">Preparando Motor de Visión OpenCV...<br><small>(Esto puede tardar unos segundos)</small></p>
    </div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="process"></canvas>
  <canvas id="overlay"></canvas>
  
  <div id="objects"></div>
  
  <div id="ui">
    <h2>🏕️ AR Aventura</h2>
    <div id="status">Esperando cámara...</div>
    <button id="start">📷 Iniciar cámara</button>
    <button id="debug">🔎 Ver Rastreador Azul</button>
    <div style="font-size:11px;color:#aaa;margin-top:8px">Usa tu dado físico. Mueve el cubo AZUL frente a la cámara para interactuar.</div>
  </div>

  <!-- Modal de Trivia en el centro -->
  <div id="triviaPanel">
    <div id="triviaIcon">👑</div>
    <h3 id="triviaTitle">El Rey</h3>
    <p id="triviaQuestion">¿Nombra un rey de las películas de Disney?</p>
    <button id="closeTrivia">¡Respondido!</button>
  </div>

  <!-- 1. Configuramos el "escuchador" ANTES de cargar OpenCV -->
  <script>
    var Module = {
      onRuntimeInitialized: function() {
        document.getElementById('loading').classList.add('hide');
        document.getElementById('status').textContent = '🟢 Motor Listo. Pulsa "Iniciar cámara".';
        window.cvListo = true;
      }
    };
  </script>

  <!-- 2. Cargamos OpenCV de forma síncrona y estable -->
  <script src="https://docs.opencv.org/4.5.0/opencv.js" type="text/javascript"></script>
  
  <!-- 3. Lógica del Juego y Visión Artificial -->
  <script>
  (() => {
    const video = document.getElementById('video');
    const processCanvas = document.getElementById('process');
    const pctx = processCanvas.getContext('2d', {willReadFrequently:true});
    const overlay = document.getElementById('overlay');
    const octx = overlay.getContext('2d');
    const objects = document.getElementById('objects');
    const statusEl = document.getElementById('status');
    const loading = document.getElementById('loading');
    const triviaPanel = document.getElementById('triviaPanel');
    
    let stream = null, running = false, debug = false, frameCounter = 0;
    let activeCellIndex = -1; // Guarda en qué casilla está el cubo

    // Coordenadas del anclaje principal (La hoja/marcador físico)
    const templateCorners = [{x: 100, y: 100}, {x: 1180, y: 100}, {x: 1180, y: 700}, {x: 100, y: 700}];

    // Generar casillas temáticas
    const gameData = [
      {i:'🏰', t:'Castillo', q:'¿Qué tipo de criaturas escupen fuego y vigilan castillos?'},
      {i:'🦁', t:'León', q:'¿Quién es conocido como el "Rey de la Selva"?'},
      {i:'👑', t:'El Rey', q:'Nombra a algún rey de las películas de Disney.'},
      {i:'🐉', t:'Dragón', q:'Si tuvieras un dragón de mascota, ¿qué nombre le pondrías?'},
      {i:'🧙‍♂️', t:'Mago', q:'Nombra un hechizo mágico famoso.'},
      {i:'💎', t:'Diamante', q:'¿De qué color son los rubíes y las esmeraldas?'},
      {i:'⚔️', t:'Espadas', q:'¿Preferirías luchar con espada o con arco y flecha?'},
      {i:'🐎', t:'Caballo', q:'¿Cómo se llama el sonido que hacen los caballos?'},
      {i:'🗺️', t:'Mapa', q:'Si encontraras un mapa del tesoro, ¿dónde buscarías primero?'},
      {i:'💰', t:'Oro', q:'¿Qué comprarías con un cofre lleno de monedas de oro?'}
    ];

    // Construimos la ruta de 25 posiciones formando un gran rectángulo exterior
    const cells = [];
    const totalCells = 25;
    
    for(let i=0; i<totalCells; i++) {
      let x = 0, y = 0;
      if(i < 8) { x = 150 + i * 140; y = 150; } // Borde superior
      else if(i < 13) { x = 1130; y = 150 + (i-7) * 110; } // Borde derecho
      else if(i < 20) { x = 1130 - (i-12) * 140; y = 700; } // Borde inferior
      else { x = 150; y = 700 - (i-19) * 110; } // Borde izquierdo

      const data = gameData[i % gameData.length];
      cells.push({ x, y, icon: data.i, title: `${i+1}. ${data.t}`, question: data.q });
    }

    function svgCell(icon, num) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="#fff" stroke="#ff9800" stroke-width="6"/>
        <text x="50" y="55" text-anchor="middle" dominant-baseline="middle" font-size="40">${icon}</text>
        <circle cx="20" cy="20" r="14" fill="#f44336"/>
        <text x="20" y="25" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#fff">${num}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function buildScene() {
      objects.innerHTML = '';
      cells.forEach((c, i) => {
        const d = document.createElement('div'); 
        d.className = 'cell'; d.id = 'cell_'+i;
        const img = document.createElement('img'); 
        img.src = svgCell(c.icon, i+1);
        d.appendChild(img); objects.appendChild(d);
      });
    }
    
    addEventListener('resize', () => { overlay.width = innerWidth; overlay.height = innerHeight; });
    dispatchEvent(new Event('resize')); buildScene();

    // Eventos UI
    document.getElementById('start').addEventListener('click', async () => {
      if (!window.cvListo) {
        alert("Aún cargando el motor OpenCV. Por favor espera unos segundos más.");
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: {facingMode:'environment', width:1280, height:720} });
        video.srcObject = stream; await video.play();
        running = true;
        statusEl.textContent = 'Buscando anclas y el Cubo Azul...';
        requestAnimationFrame(loop);
      } catch (e) { statusEl.textContent = '❌ Error cámara: ' + e.message; }
    });
    
    document.getElementById('debug').addEventListener('click', () => { debug = !debug; });
    
    document.getElementById('closeTrivia').addEventListener('click', () => {
      triviaPanel.classList.remove('show');
      // Timeout para evitar que se abra inmediatamente de nuevo si el cubo sigue ahí
      setTimeout(() => { activeCellIndex = -1; }, 2000); 
    });

    // --- FUNCIONES DE VISIÓN ARTIFICIAL ---
    function findAnchors(src, gray, bw, contours, hierarchy) {
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.adaptiveThreshold(gray, bw, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 21, 10);
      cv.findContours(bw, contours, hierarchy, cv.RETR_TREE, cv.CHAIN_APPROX_SIMPLE);
      let centers = [];
      for (let i = 0; i < contours.size(); i++) {
        let h = hierarchy.intPtr(0, i);
        if (h[2] !== -1 && hierarchy.intPtr(0, h[2])[2] !== -1) {
          let c = contours.get(i), area = cv.contourArea(c);
          if (area > 150 && area < 50000) {
            let m = cv.moments(c);
            if (m.m00 > 0) centers.push({x: m.m10/m.m00, y: m.m01/m.m00});
          }
          c.delete();
        }
      }
      let unique = [];
      for (let p of centers) if (!unique.find(u => Math.hypot(u.x-p.x, u.y-p.y) < 30)) unique.push(p);
      if (unique.length === 4) {
        const sum = unique.map(p => p.x+p.y), diff = unique.map(p => p.x-p.y);
        return [
          unique[sum.indexOf(Math.min(...sum))], unique[diff.indexOf(Math.max(...diff))],
          unique[sum.indexOf(Math.max(...sum))], unique[diff.indexOf(Math.min(...diff))]
        ];
      }
      return null;
    }

    function findBlueObject(src, hsv, mask, contours, hierarchy) {
      cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
      cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
      
      // Rango de color Azul en OpenCV (Matices HSV)
      let low = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [90, 120, 70, 0]);
      let high = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [130, 255, 255, 0]);
      cv.inRange(hsv, low, high, mask);
      
      cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
      let bestPoint = null, maxArea = 0;
      
      for (let i = 0; i < contours.size(); i++) {
        let cnt = contours.get(i);
        let area = cv.contourArea(cnt);
        if (area > 400 && area > maxArea) {
          maxArea = area;
          let m = cv.moments(cnt);
          if (m.m00 > 0) bestPoint = { x: m.m10/m.m00, y: m.m01/m.m00, area };
        }
        cnt.delete();
      }
      low.delete(); high.delete();
      return bestPoint;
    }

    function projectPoint(H, p) {
      const a = H.data64F, x = p.x, y = p.y, w = a[6]*x + a[7]*y + a[8];
      return { x: (a[0]*x + a[1]*y + a[2])/w, y: (a[3]*x + a[4]*y + a[5])/w };
    }

    function cameraToScreen(p) {
      const scale = Math.max(innerWidth/video.videoWidth, innerHeight/video.videoHeight);
      return { 
        x: p.x * scale + (innerWidth - video.videoWidth * scale)/2, 
        y: p.y * scale + (innerHeight - video.videoHeight * scale)/2 
      };
    }

    function loop() {
      if (!running || !video.videoWidth) { requestAnimationFrame(loop); return; }
      if (++frameCounter % 2 !== 0) { requestAnimationFrame(loop); return; }

      processCanvas.width = video.videoWidth; processCanvas.height = video.videoHeight;
      pctx.drawImage(video, 0, 0, processCanvas.width, processCanvas.height);

      let src = null, gray = null, bw = null, hsv = null, mask = null;
      let contours = null, hierarchy = null, H = null;

      try {
        src = cv.imread(processCanvas);
        gray = new cv.Mat(); bw = new cv.Mat(); hsv = new cv.Mat(); mask = new cv.Mat();
        contours = new cv.MatVector(); hierarchy = new cv.Mat();

        const anchors = findAnchors(src, gray, bw, contours, hierarchy);
        const blueCubeCamera = findBlueObject(src, hsv, mask, contours, hierarchy);
        
        octx.clearRect(0,0,overlay.width,overlay.height);

        if (anchors) {
          const srcPts = cv.matFromArray(4, 2, cv.CV_32F, templateCorners.flatMap(p => [p.x, p.y]));
          const dstPts = cv.matFromArray(4, 2, cv.CV_32F, anchors.flatMap(p => [p.x, p.y]));
          H = cv.getPerspectiveTransform(srcPts, dstPts);
          
          const angle = Math.atan2(anchors[1].y - anchors[0].y, anchors[1].x - anchors[0].x) * 180 / Math.PI;
          const transformStr = `translate(-50%,-50%) rotate(${angle}deg)`;

          let cubeScreenPos = blueCubeCamera ? cameraToScreen(blueCubeCamera) : null;

          cells.forEach((c, i) => {
            const el = document.getElementById('cell_'+i);
            const camPos = projectPoint(H, c);
            const screenPos = cameraToScreen(camPos);
            
            el.style.left = screenPos.x + 'px'; 
            el.style.top = screenPos.y + 'px';
            el.style.transform = transformStr;
            el.style.display = 'block';

            // Comprobar colisión entre el cubo azul y esta casilla
            if (cubeScreenPos && activeCellIndex === -1 && !triviaPanel.classList.contains('show')) {
              const dist = Math.hypot(screenPos.x - cubeScreenPos.x, screenPos.y - cubeScreenPos.y);
              if (dist < 45) { // Si el cubo está a menos de 45px del centro de la casilla
                activeCellIndex = i;
                el.classList.add('active'); 
                
                // Configurar y mostrar Modal de Trivia
                document.getElementById('triviaIcon').textContent = c.icon;
                document.getElementById('triviaTitle').textContent = c.title;
                document.getElementById('triviaQuestion').textContent = c.question;
                triviaPanel.classList.add('show');
              } else {
                el.classList.remove('active');
              }
            }
          });

          // Dibujar el rastreador sobre el cubo azul (si debug está activo o como feedback visual)
          if (cubeScreenPos) {
            octx.beginPath(); octx.arc(cubeScreenPos.x, cubeScreenPos.y, 25, 0, 2*Math.PI);
            octx.lineWidth = 4; octx.strokeStyle = '#00e5ff'; octx.stroke();
            octx.fillStyle = 'rgba(0, 229, 255, 0.3)'; octx.fill();
            statusEl.textContent = '🟢 Tablero y Jugador detectados.';
          } else {
            statusEl.textContent = '🟡 Tablero OK. Falta cubo azul en cámara.';
          }

          if(debug) {
            octx.strokeStyle = '#00ff66'; octx.lineWidth = 2; octx.beginPath();
            anchors.forEach((q, i) => { const s = cameraToScreen(q); i ? octx.lineTo(s.x, s.y) : octx.moveTo(s.x, s.y); });
            octx.closePath(); octx.stroke();
          }
          srcPts.delete(); dstPts.delete();
        } else {
          document.querySelectorAll('.cell').forEach(e => e.style.display = 'none');
          statusEl.textContent = '🔎 Enfoca el marcador base (hoja de anclas)...';
        }

      } catch(e) { console.error(e); 
      } finally {
        if(src) src.delete(); if(gray) gray.delete(); if(bw) bw.delete(); 
        if(hsv) hsv.delete(); if(mask) mask.delete(); if(contours) contours.delete(); 
        if(hierarchy) hierarchy.delete(); if(H) H.delete();
        requestAnimationFrame(loop);
      }
    }
    
    // Aviso en caso de que el navegador esté bloqueando scripts (como ocurre si no usas servidor local)
    setTimeout(() => {
      if (!window.cvListo) {
        document.getElementById('loadText').innerHTML = '⚠️ El servidor está tardando mucho.<br><br><strong>Recuerda:</strong> Si abriste este archivo con doble clic, el navegador lo bloqueará por seguridad. Necesitas usar un servidor local (como <em>Live Server</em> en VSCode).';
      }
    }, 12000);

  })();
  </script>
</body>
</html>
