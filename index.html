<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>AR Aventura - Tablero Interactivo Phygital</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
    #overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    
    #ui { position: fixed; z-index: 20; left: 12px; top: 12px; max-width: 320px; color: #fff; background: rgba(0,0,0,.8); padding: 14px; border-radius: 12px; backdrop-filter: blur(5px); }
    #ui h2 { margin: 0 0 10px; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 8px; }
    #status { font-size: 14px; font-weight: bold; color: #ffeb3b; margin-bottom: 10px; }
    button { border: 0; border-radius: 8px; padding: 10px; font-weight: bold; cursor: pointer; background: #00c853; color: #fff; width: 100%; margin-bottom: 6px; }
    button:hover { background: #00e676; }
    button#debug { background: #fff; color: #111; }
    button#debug:hover { background: #eee; }
    
    #objects { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    
    /* Casillas Cuadradas Grandes */
    .cell { position: absolute; left: 0; top: 0; width: 95px; height: 95px; transform: translate(-50%,-50%); display: none; will-change: left, top, transform; transition: transform 0.2s, left 0.1s ease-out, top 0.1s ease-out; }
    .cell img { width: 100%; height: 100%; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.8)); }
    .cell.active { transform: translate(-50%,-50%) scale(1.3); z-index: 30; } 

    /* Panel de Trivia Central Estilo Jumanji */
    #triviaPanel { 
      position: absolute; 
      left: 50%; 
      top: 50%; 
      transform: translate(-50%,-50%) scale(0); 
      width: 350px; 
      max-width: 88vw; 
      background: linear-gradient(145deg, #2c1a0e 0%, #170d06 100%); 
      border: 4px solid #dfa010; 
      border-radius: 20px; 
      padding: 24px; 
      color: #f3e5ab; 
      text-align: center; 
      box-shadow: 0 0 45px rgba(223, 160, 16, 0.7), inset 0 0 20px rgba(0,0,0,0.9); 
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      z-index: 40; 
      pointer-events: auto; 
    }
    #triviaPanel.show { transform: translate(-50%,-50%) scale(1); }
    #triviaIcon { font-size: 65px; margin: 0 0 10px 0; text-shadow: 0 0 15px rgba(255,215,0,0.6); }
    #triviaTitle { color: #ffd700; margin: 0 0 15px; font-size: 26px; font-family: 'Georgia', serif; text-transform: uppercase; letter-spacing: 2px; }
    #triviaQuestion { font-size: 20px; line-height: 1.4; margin-bottom: 25px; color: #fff8e7; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
    #closeTrivia { background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); color: #170d06; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; padding: 14px 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-transform: uppercase; letter-spacing: 1px; }
    #closeTrivia:hover { background: linear-gradient(180deg, #ffe44d 0%, #d4af37 100%); transform: scale(1.05); }

    #loading { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #111; color: #fff; text-align: center; padding: 20px; }
    #loading.hide { display: none; }
    #process { display: none; }
    
    .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #00c853; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div>
      <div class="spinner"></div>
      <h2>🏕️ AR Aventura</h2>
      <p id="loadText">Cargando Motor de Estabilidad AR...<br><small>Conectando al servidor...</small></p>
    </div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="process"></canvas>
  <canvas id="overlay"></canvas>
  
  <div id="objects"></div>
  
  <div id="ui">
    <h2>🏕️ AR Aventura</h2>
    <div id="status">Esperando cámara...</div>
    <button id="start">📷 Iniciar cámara y jugar</button>
    <button id="debug">🔎 Modo Depuración</button>
    <div style="font-size:12px;color:#aaa;margin-top:8px">Mueve el cubo AZUL frente a la cámara para interactuar.</div>
  </div>

  <div id="triviaPanel">
    <div id="triviaIcon">👑</div>
    <h3 id="triviaTitle">El Rey</h3>
    <p id="triviaQuestion">¡Ponte tu corona imaginaria y da una orden real!</p>
    <button id="closeTrivia">¡HECHO!</button>
  </div>

  <script>
    window.cvListo = false;

    const cdns = [
      "https://docs.opencv.org/4.7.0/opencv.js",
      "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-development/opencv.js"
    ];

    let currentCdnIndex = 0;

    function inicializarMotor() {
      if (window.cvListo) return;
      window.cvListo = true;
      document.getElementById('loading').classList.add('hide');
      document.getElementById('status').textContent = '🟢 Sistema Listo. Pulsa "Iniciar cámara".';
    }

    function cargarSiguienteCDN() {
      if (currentCdnIndex >= cdns.length) {
        document.getElementById('loadText').innerHTML = '❌ Error de conexión.<br><small>Recarga la página.</small>';
        document.querySelector('.spinner').style.display = 'none';
        return;
      }
      const script = document.createElement('script');
      script.src = cdns[currentCdnIndex];
      script.async = true;
      script.onload = () => { if (typeof cv !== 'undefined' && cv.Mat) inicializarMotor(); };
      script.onerror = () => { currentCdnIndex++; cargarSiguienteCDN(); };
      window.Module = { onRuntimeInitialized: inicializarMotor };
      document.head.appendChild(script);
    }
    cargarSiguienteCDN();
  </script>
  
  <script>
  (() => {
    const video = document.getElementById('video');
    const processCanvas = document.getElementById('process');
    const pctx = processCanvas.getContext('2d', {willReadFrequently:true});
    const overlay = document.getElementById('overlay');
    const octx = overlay.getContext('2d');
    const objects = document.getElementById('objects');
    const statusEl = document.getElementById('status');
    const triviaPanel = document.getElementById('triviaPanel');
    
    let stream = null, running = false, debug = false, frameCounter = 0;
    let activeCellIndex = -1; 
    
    // Variables de Estabilidad y Suavizado Anti-Parpadeo
    let lastAnchors = null;
    let missedFrames = 0;
    const MAX_MISSED_FRAMES = 15; // Mantiene el tablero visible durante ~0.5 segundos de interrupción
    
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      if (type === 'magic') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
        gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'click') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      }
    }

    const templateCorners = [{x: 100, y: 100}, {x: 1180, y: 100}, {x: 1180, y: 700}, {x: 100, y: 700}];

    const gameData = [
      {i:'🏰', t:'Castillo', q:'¡Defiende el castillo! Ponte de pie y haz tu mejor pose de guardia real.'},
      {i:'🦁', t:'León', q:'¡Muestra tus garras y ruge muy fuerte como el Rey de la Selva!'},
      {i:'👑', t:'El Rey', q:'¡Ponte tu corona imaginaria y da una orden real con voz muy grave!'},
      {i:'🐉', t:'Dragón', q:'¡Abre la boca e imagina que escupes fuego por 3 segundos! 🔥'},
      {i:'🧙‍♂️', t:'Mago', q:'¡Agita tu varita y di las palabras mágicas "Abracadabra, pata de cabra"!'},
      {i:'💎', t:'Diamante', q:'¡Brilla mucho! Levanta las manos y muévelas rápido como un destello.'},
      {i:'⚔️', t:'Espadas', q:'¡En guardia! Haz 3 movimientos lentos como si estuvieras en un duelo.'},
      {i:'🐎', t:'Caballo', q:'¡Trota en tu lugar y haz el sonido de un caballo galopando!'},
      {i:'🗺️', t:'Mapa', q:'¡Pon tu mano en la frente como un explorador buscando el tesoro!'},
      {i:'💰', t:'Oro', q:'¡Encontraste el tesoro pirata! Da un salto muy alto de alegría.'}
    ];

    const cells = [];
    const totalCells = 25;
    
    for(let i=0; i<totalCells; i++) {
      let x = 0, y = 0;
      if(i < 8) { x = 150 + i * 140; y = 150; } 
      else if(i < 13) { x = 1130; y = 150 + (i-7) * 110; } 
      else if(i < 20) { x = 1130 - (i-12) * 140; y = 700; } 
      else { x = 150; y = 700 - (i-19) * 110; } 

      const data = gameData[i % gameData.length];
      cells.push({ x, y, icon: data.i, title: `${i+1}. ${data.t}`, question: data.q });
    }

    function svgCell(icon, num) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
        <rect x="5" y="5" width="90" height="90" rx="15" fill="#ffffff" stroke="#dfa010" stroke-width="6"/>
        <text x="50" y="55" text-anchor="middle" dominant-baseline="middle" font-size="52">${icon}</text>
        <circle cx="20" cy="20" r="18" fill="#f44336" stroke="#fff" stroke-width="3"/>
        <text x="20" y="22" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="900" fill="#fff">${num}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function buildScene() {
      objects.innerHTML = '';
      cells.forEach((c, i) => {
        const d = document.createElement('div'); 
        d.className = 'cell'; d.id = 'cell_'+i;
        const img = document.createElement('img'); 
        img.src = svgCell(c.icon, i+1);
        d.appendChild(img); objects.appendChild(d);
      });
    }
    
    addEventListener('resize', () => { overlay.width = innerWidth; overlay.height = innerHeight; });
    dispatchEvent(new Event('resize')); buildScene();

    document.getElementById('start').addEventListener('click', async () => {
      if (!window.cvListo) {
        alert("Aún se está cargando el sistema. Por favor espera.");
        return;
      }
      initAudio();
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: {facingMode:'environment', width:1280, height:720} });
        video.srcObject = stream; await video.play();
        running = true;
        statusEl.textContent = 'Buscando tablero...';
        requestAnimationFrame(loop);
      } catch (e) { statusEl.textContent = '❌ Error cámara: ' + e.message; }
    });
    
    document.getElementById('debug').addEventListener('click', () => { debug = !debug; });
    
    document.getElementById('closeTrivia').addEventListener('click', () => {
      playSound('click');
      triviaPanel.classList.remove('show');
      setTimeout(() => { activeCellIndex = -1; }, 2000); 
    });

    // Función de Suavizado de Puntos (Exponential Moving Average)
    function smoothAnchors(newAnchors, prevAnchors, factor = 0.4) {
      if (!prevAnchors) return newAnchors;
      return newAnchors.map((p, i) => ({
        x: prevAnchors[i].x + (p.x - prevAnchors[i].x) * factor,
        y: prevAnchors[i].y + (p.y - prevAnchors[i].y) * factor
      }));
    }

    function findAnchors(src, gray, bw, contours, hierarchy) {
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      
      // Filtro Gaussiano para eliminar ruido de iluminación
      let ksize = new cv.Size(3, 3);
      cv.GaussianBlur(gray, gray, ksize, 0);

      // Umbral adaptativo ajustado para tolerar sombras
      cv.adaptiveThreshold(gray, bw, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 25, 8);
      cv.findContours(bw, contours, hierarchy, cv.RETR_TREE, cv.CHAIN_APPROX_SIMPLE);
      
      let centers = [];
      for (let i = 0; i < contours.size(); i++) {
        let h = hierarchy.intPtr(0, i);
        if (h[2] !== -1 && hierarchy.intPtr(0, h[2])[2] !== -1) {
          let c = contours.get(i), area = cv.contourArea(c);
          if (area > 100 && area < 60000) {
            let m = cv.moments(c);
            if (m.m00 > 0) centers.push({x: m.m10/m.m00, y: m.m01/m.m00});
          }
          c.delete();
        }
      }
      let unique = [];
      for (let p of centers) if (!unique.find(u => Math.hypot(u.x-p.x, u.y-p.y) < 35)) unique.push(p);
      if (unique.length === 4) {
        const sum = unique.map(p => p.x+p.y), diff = unique.map(p => p.x-p.y);
        return [
          unique[sum.indexOf(Math.min(...sum))], unique[diff.indexOf(Math.max(...diff))],
          unique[sum.indexOf(Math.max(...sum))], unique[diff.indexOf(Math.min(...diff))]
        ];
      }
      return null;
    }

    function findBlueObject(src, hsv, mask, contours, hierarchy) {
      cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
      cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
      let low = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [85, 100, 60, 0]);
      let high = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [135, 255, 255, 0]);
      cv.inRange(hsv, low, high, mask);
      cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
      let bestPoint = null, maxArea = 0;
      for (let i = 0; i < contours.size(); i++) {
        let cnt = contours.get(i);
        let area = cv.contourArea(cnt);
        if (area > 350 && area > maxArea) {
          maxArea = area;
          let m = cv.moments(cnt);
          if (m.m00 > 0) bestPoint = { x: m.m10/m.m00, y: m.m01/m.m00, area };
        }
        cnt.delete();
      }
      low.delete(); high.delete();
      return bestPoint;
    }

    function projectPoint(H, p) {
      const a = H.data64F, x = p.x, y = p.y, w = a[6]*x + a[7]*y + a[8];
      return { x: (a[0]*x + a[1]*y + a[2])/w, y: (a[3]*x + a[4]*y + a[5])/w };
    }

    function cameraToScreen(p) {
      const scale = Math.max(innerWidth/video.videoWidth, innerHeight/video.videoHeight);
      return { 
        x: p.x * scale + (innerWidth - video.videoWidth * scale)/2, 
        y: p.y * scale + (innerHeight - video.videoHeight * scale)/2 
      };
    }

    function loop() {
      if (!running || !video.videoWidth) { requestAnimationFrame(loop); return; }

      processCanvas.width = video.videoWidth; processCanvas.height = video.videoHeight;
      pctx.drawImage(video, 0, 0, processCanvas.width, processCanvas.height);

      let src = null, gray = null, bw = null, hsv = null, mask = null;
      let contours = null, hierarchy = null, H = null;

      try {
        src = cv.imread(processCanvas);
        gray = new cv.Mat(); bw = new cv.Mat(); hsv = new cv.Mat(); mask = new cv.Mat();
        contours = new cv.MatVector(); hierarchy = new cv.Mat();

        let rawAnchors = findAnchors(src, gray, bw, contours, hierarchy);
        let anchors = null;

        // Gestión de estabilidad y tolerancia
        if (rawAnchors) {
          anchors = smoothAnchors(rawAnchors, lastAnchors, 0.35); // Filtro suavizador
          lastAnchors = anchors;
          missedFrames = 0;
        } else if (lastAnchors && missedFrames < MAX_MISSED_FRAMES) {
          anchors = lastAnchors; // Usar memoria temporal si hay pérdida rápida
          missedFrames++;
        } else {
          lastAnchors = null;
        }

        const blueCubeCamera = findBlueObject(src, hsv, mask, contours, hierarchy);
        octx.clearRect(0,0,overlay.width,overlay.height);

        if (anchors) {
          const srcPts = cv.matFromArray(4, 2, cv.CV_32F, templateCorners.flatMap(p => [p.x, p.y]));
          const dstPts = cv.matFromArray(4, 2, cv.CV_32F, anchors.flatMap(p => [p.x, p.y]));
          H = cv.getPerspectiveTransform(srcPts, dstPts);
          
          const angle = Math.atan2(anchors[1].y - anchors[0].y, anchors[1].x - anchors[0].x) * 180 / Math.PI;
          const transformStr = `translate(-50%,-50%) rotate(${angle}deg)`;

          let cubeScreenPos = blueCubeCamera ? cameraToScreen(blueCubeCamera) : null;

          cells.forEach((c, i) => {
            const el = document.getElementById('cell_'+i);
            const camPos = projectPoint(H, c);
            const screenPos = cameraToScreen(camPos);
            
            el.style.left = screenPos.x + 'px'; 
            el.style.top = screenPos.y + 'px';
            el.style.transform = transformStr;
            el.style.display = 'block';

            if (cubeScreenPos && activeCellIndex === -1 && !triviaPanel.classList.contains('show')) {
              const dist = Math.hypot(screenPos.x - cubeScreenPos.x, screenPos.y - cubeScreenPos.y);
              if (dist < 60) { 
                activeCellIndex = i;
                el.classList.add('active'); 
                
                document.getElementById('triviaIcon').textContent = c.icon;
                document.getElementById('triviaTitle').textContent = c.title;
                document.getElementById('triviaQuestion').textContent = c.question;
                
                playSound('magic');
                triviaPanel.classList.add('show');
              } else {
                el.classList.remove('active');
              }
            }
          });

          if (cubeScreenPos) {
            octx.beginPath(); octx.arc(cubeScreenPos.x, cubeScreenPos.y, 25, 0, 2*Math.PI);
            octx.lineWidth = 4; octx.strokeStyle = '#00e5ff'; octx.stroke();
            octx.fillStyle = 'rgba(0, 229, 255, 0.3)'; octx.fill();
            statusEl.textContent = '🟢 Tablero Estable y Jugador OK.';
          } else {
            statusEl.textContent = '🟡 Tablero OK. Esperando Cubo Azul...';
          }

          if(debug) {
            octx.strokeStyle = '#00ff66'; octx.lineWidth = 2; octx.beginPath();
            anchors.forEach((q, i) => { const s = cameraToScreen(q); i ? octx.lineTo(s.x, s.y) : octx.moveTo(s.x, s.y); });
            octx.closePath(); octx.stroke();
          }
          srcPts.delete(); dstPts.delete();
        } else {
          document.querySelectorAll('.cell').forEach(e => e.style.display = 'none');
          statusEl.textContent = '🔎 Apunta la cámara hacia la plantilla...';
        }

      } catch(e) { console.error(e); 
      } finally {
        if(src) src.delete(); if(gray) gray.delete(); if(bw) bw.delete(); 
        if(hsv) hsv.delete(); if(mask) mask.delete(); if(contours) contours.delete(); 
        if(hierarchy) hierarchy.delete(); if(H) H.delete();
        requestAnimationFrame(loop);
      }
    }
  })();
  </script>
</body>
</html>
